name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore AttendanceSystem.sln

      - name: Package Vulnerability Audit
        run: dotnet list package --vulnerable --include-transitive

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes --verbosity normal
        continue-on-error: true

      - name: Build Solution (Release)
        run: dotnet build AttendanceSystem.sln -c Release --no-restore

      - name: Execute Tests with Coverage
        run: >
          dotnet test AttendanceSystem.sln
          -c Release
          --no-build
          --verbosity normal
          --settings tests/coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14

  # C06 / F03-08: concurrencia, unicidad y rollback contra PostgreSQL real (no se omiten en CI).
  postgres-relational-tests:
    name: PostgreSQL Relational & Concurrency Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendanceuser
          POSTGRES_PASSWORD: AttendancePass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendanceuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=attendanceuser;Password=AttendancePass
      REQUIRE_POSTGRES_TESTS: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Las pruebas de respaldo y restauración ejecutan pg_dump, pg_restore y psql reales.
      - name: Install PostgreSQL client tools
        run: |
          # Las herramientas deben ser de la versión del servidor (postgres:16): un pg_dump más nuevo emite parámetros
          # (p. ej. transaction_timeout en 17+) que el servidor 16 rechaza al restaurar.
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Run Infrastructure Tests (PostgreSQL)
        run: >
          dotnet test tests/AttendanceSystem.Infrastructure.Tests/AttendanceSystem.Infrastructure.Tests.csproj
          -c Release
          --logger "trx;LogFileName=postgres-tests.trx"
          --results-directory ./TestResults

      - name: Upload PostgreSQL Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: ./TestResults
          retention-days: 14
