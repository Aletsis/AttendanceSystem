name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download PostgreSQL Installer
        shell: powershell
        run: |
          Write-Host "Downloading PostgreSQL 16.1 installer..."
          Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-16.1-1-windows-x64.exe" -OutFile "Deploy/postgresql-installer.exe"
          Write-Host "PostgreSQL downloaded successfully."

      - name: Download .NET 9.0 Hosting Bundle
        shell: powershell
        run: |
          Write-Host "Downloading .NET 9.0 Hosting Bundle..."
          # URL para el Hosting Bundle de .NET 9.0
          Invoke-WebRequest -Uri "https://download.visualstudio.microsoft.com/download/pr/8f946461-460d-45bf-a602-0e2ff406fb76/e939a3f295b95a8d46df3c965e648c69/dotnet-hosting-9.0.0-win.exe" -OutFile "Deploy/dotnet-hosting.exe"
          Write-Host ".NET Hosting Bundle downloaded successfully."

      - name: Prepare Release Artifacts
        shell: powershell
        run: |
          # Ejecutar el script que compila la web y el servicio
          .\Prepare-Release.ps1

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          iscc Deploy/setup_script.iss

      - name: Verify Installer Output
        shell: powershell
        run: |
          if (Test-Path "Output/AttendanceSystem_Setup.exe") {
              Write-Host "Installer compiled successfully!"
          } else {
              Write-Error "Installer file Output/AttendanceSystem_Setup.exe was not found."
              exit 1
          }

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Output/AttendanceSystem_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
